version: '3'
services: 
  cinema_kg:
    build:
      context: .
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000" # host:container 
    depends_on:
      - cinema_data
  cinema_data: 
    image: 'postgres:14'
    environment:
      POSTGRES_DB: cinema_kg_test
      POSTGRES_USER: cinema_kg_test_user
      POSTGRES_PASSWORD: 1234
    volumes:
      - 'data:/var/lib/postgresql/data'
volumes:
  data: